name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itfin360
          POSTGRES_PASSWORD: itfin360
          POSTGRES_DB: itfin360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itfin360 -d itfin360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://itfin360:itfin360@localhost:5432/itfin360?schema=public
      MIGRATION_DATABASE_URL: postgresql://itfin360:itfin360@localhost:5432/itfin360?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: itfin360
      S3_SECRET_ACCESS_KEY: itfin360dev
      S3_BUCKET: itfin360-ci
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4

      # MinIO no puede declararse como `service`: necesita el argumento `server /data`,
      # que GitHub Actions no permite pasar a un contenedor de servicio.
      - name: Levantar MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER="$S3_ACCESS_KEY_ID" \
            -e MINIO_ROOT_PASSWORD="$S3_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 2
          done
          echo "MinIO no llegó a estar sano" >&2
          docker logs minio >&2
          exit 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Gate obligatorio: `next.config.ts` tiene `eslint.ignoreDuringBuilds: true`,
      # así que el único sitio donde el linter corre de verdad es aquí.
      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Cobertura de finance-core (gate ≥ 95 %)
        run: pnpm test:coverage

      - name: Política RLS en las migraciones
        run: pnpm rls:check

      - name: Build
        run: pnpm build
