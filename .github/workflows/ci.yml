name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `feat/**` para que las PR apiladas (una tarea sobre otra) pasen CI antes de
    # llegar a `main`, no sólo cuando GitHub las reapunta al fusionar su base.
    branches: [main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: itfin360
          POSTGRES_PASSWORD: itfin360
          POSTGRES_DB: itfin360
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U itfin360 -d itfin360"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      APP_URL: http://localhost:3000
      DATABASE_URL: postgresql://itfin360:itfin360@localhost:5432/itfin360?schema=public
      MIGRATION_DATABASE_URL: postgresql://itfin360:itfin360@localhost:5432/itfin360?schema=public
      REDIS_URL: redis://localhost:6379

    # Aquí había un paso que levantaba MinIO. Se ha quitado el 26 de septiembre
    # por dos razones que se juntaron.
    #
    # La primera: no lo usaba nadie. Ni una línea de código ni un test toca S3
    # en todo el repositorio. El almacenamiento de ficheros entra con el OCR, y
    # hasta entonces levantar MinIO en cada PR era pagar medio minuto y una
    # dependencia externa a cambio de nada.
    #
    # La segunda: dejó de poderse descargar. quay.io empezó a responder
    # `unauthorized` a esa imagen y Docker Hub `pull access denied`, así que
    # todas las PR se quedaban en rojo antes de llegar al lint, por algo que no
    # tenía nada que ver con el código que traían.
    #
    # Cuando haga falta de verdad, vuelve con su tag comprobado y, a ser
    # posible, con la imagen espejada en el registro de GitHub para no depender
    # de que un tercero siga publicando la misma etiqueta dentro de dos años.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Gate obligatorio: `next.config.ts` tiene `eslint.ignoreDuringBuilds: true`,
      # así que el único sitio donde el linter corre de verdad es aquí.
      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

      - name: Cobertura de finance-core (gate ≥ 95 %)
        run: pnpm test:coverage

      - name: Política RLS en las migraciones
        run: pnpm rls:check

      - name: Build
        run: pnpm build
