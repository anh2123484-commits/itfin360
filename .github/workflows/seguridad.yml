name: Seguridad

# Análisis que siguen funcionando cuando el repositorio pase a privado
# (docs/10-plan-reestructuracion.md §6). En el plan gratuito de GitHub, un
# repositorio privado no tiene CodeQL; esto cubre ese hueco.
#
# - gitleaks: ningún secreto en los commits de la PR. Bloquea.
# - Semgrep CE: análisis estático con las reglas públicas. De momento solo
#   informa: la primera ejecución se revisa a mano y, cuando el resultado esté
#   limpio, pasa a bloquear (tarea S-04 de docs/11-backlog-plataforma.md).
#
# Los lunes se revisa además el historial completo, no solo lo que trae la PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: seguridad-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.28.0
  # sha256 del tar de linux_x64, sacado de gitleaks_8.28.0_checksums.txt de la
  # release oficial. Si no coincide, el paso falla antes de ejecutar nada.
  GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb

jobs:
  secretos:
    name: secretos (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta el historial para revisar los commits de la PR uno a uno:
          # un secreto que se añade y se borra en la misma PR sigue en el
          # historial aunque el último commit esté limpio.
          fetch-depth: 0

      - name: Instalar gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      - name: Commits de la PR
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts="${BASE}..${HEAD}"

      - name: Árbol de main
        if: github.event_name == 'push'
        run: ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Historial completo
        if: github.event_name == 'schedule'
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner

  estatico:
    name: análisis estático (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: python -m pip install --quiet semgrep

      # Sin métricas: el código no sale del runner, solo se descargan las reglas.
      - name: Analizar
        continue-on-error: true
        run: |
          semgrep scan --metrics=off \
            --config p/default --config p/typescript --config p/nextjs \
            --exclude '**/*.test.ts' --exclude '**/generated/**' \
            --json --output semgrep.json
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open('semgrep.json'))
          results = data.get('results', [])
          print(f"### Semgrep: {len(results)} hallazgos\n")
          for r in results[:50]:
              print(f"- `{r['path']}:{r['start']['line']}` {r['check_id']}")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep
          path: semgrep.json
          if-no-files-found: ignore
          retention-days: 14
